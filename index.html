<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Cats 🐱</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe4f1, #e8ddff);
      color: #333;
      text-align: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 1.1rem;
    }

    button {
      background: #ff69b4;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin: 20px 0;
      transition: 0.2s;
    }

    button:hover {
      background: #ff479d;
      transform: scale(1.05);
    }

    #catContainer {
      max-width: 800px;
      margin: 20px auto;
      background: white;
      padding: 15px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    #catImage {
      width: 100%;
      max-height: 600px;
      object-fit: cover;
      border-radius: 15px;
      display: block;
    }

    #loading {
      display: none;
      padding: 20px;
      color: #888;
    }
  </style>
</head>

<body>

  <h1>🐱 Random Cats</h1>
  <p>Click the button to discover a random cat!</p>

  <button onclick="getRandomCat()">😺 Show Me a Cat</button>

  <div id="catContainer">
    <div id="loading">Loading a cute cat... 🐾</div>
    <img id="catImage" src="" alt="Random cat">
  </div>

  <script>
    async function getRandomCat() {
      const image = document.getElementById("catImage");
      const loading = document.getElementById("loading");

      image.style.display = "none";
      loading.style.display = "block";

      try {
        const response = await fetch("https://api.thecatapi.com/v1/images/search");
        const data = await response.json();

        image.src = data[0].url;
        image.onload = () => {
          loading.style.display = "none";
          image.style.display = "block";
        };

      } catch (error) {
        loading.textContent = "Oops! Couldn't find a cat 😿";
      }
    }

    // Load a cat when the page opens
    getRandomCat();
  </script>

</body>
</html>
